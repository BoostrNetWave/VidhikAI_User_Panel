name: Deploy Vidhik AI User Panel

on:
push:
branches:
- main

workflow_dispatch:

jobs:
deploy:
name: Build and Deploy User Panel
runs-on: ubuntu-latest

```
steps:

  # ============================================================
  # 1. Checkout latest code
  # ============================================================
  - name: Checkout source code
    uses: actions/checkout@v4


  # ============================================================
  # 2. Setup Node.js 20
  # ============================================================
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm


  # ============================================================
  # 3. Install dependencies
  # npm install is used because package-lock.json is currently
  # out of sync with package.json
  # ============================================================
  - name: Install dependencies
    run: npm install


  # ============================================================
  # 4. Build application
  # ============================================================
  - name: Build application
    run: npm run build


  # ============================================================
  # 5. Verify build
  # ============================================================
  - name: Verify build
    run: |
      echo "Checking build output..."

      if [ ! -d "dist" ]; then
        echo "ERROR: dist directory not found"
        exit 1
      fi

      echo "Build completed successfully"
      ls -la dist/


  # ============================================================
  # 6. Install SSH tools
  # ============================================================
  - name: Install SSH tools
    run: |
      sudo apt-get update
      sudo apt-get install -y sshpass rsync


  # ============================================================
  # 7. Create backup on server before deployment
  # ============================================================
  - name: Backup current application
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e ssh \
        -o StrictHostKeyChecking=no \
        ${SERVER_USER}@${SERVER_HOST} \
        "mkdir -p /var/www/backups && \
         if [ -d /var/www/html/VidhikAI_User_Panel/dist ]; then \
           rm -rf /var/www/backups/VidhikAI_User_Panel-dist-previous && \
           cp -a /var/www/html/VidhikAI_User_Panel/dist \
           /var/www/backups/VidhikAI_User_Panel-dist-previous; \
         fi"


  # ============================================================
  # 8. Deploy latest source code and build files
  #
  # .env is excluded because production .env already exists
  # ============================================================
  - name: Deploy application to Vultr
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e rsync -avz --delete \
        --exclude='.git/' \
        --exclude='.github/' \
        --exclude='.env' \
        --exclude='node_modules/' \
        -e "ssh -o StrictHostKeyChecking=no" \
        ./ \
        ${SERVER_USER}@${SERVER_HOST}:/var/www/html/VidhikAI_User_Panel/


  # ============================================================
  # 9. Install dependencies on server
  #
  # npm install is used instead of npm ci
  # ============================================================
  - name: Install server dependencies
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e ssh \
        -o StrictHostKeyChecking=no \
        ${SERVER_USER}@${SERVER_HOST} \
        "cd /var/www/html/VidhikAI_User_Panel && \
         npm install"


  # ============================================================
  # 10. Restart application using PM2
  # ============================================================
  - name: Restart PM2 application
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e ssh \
        -o StrictHostKeyChecking=no \
        ${SERVER_USER}@${SERVER_HOST} \
        "cd /var/www/html/VidhikAI_User_Panel && \
         if pm2 describe vidhik-user-panel > /dev/null 2>&1; then \
           pm2 restart vidhik-user-panel --update-env; \
         else \
           pm2 start 'npm start' --name vidhik-user-panel; \
         fi && \
         pm2 save"


  # ============================================================
  # 11. Check PM2 status
  # ============================================================
  - name: Check PM2 status
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e ssh \
        -o StrictHostKeyChecking=no \
        ${SERVER_USER}@${SERVER_HOST} \
        "pm2 status"


  # ============================================================
  # 12. Test Nginx configuration
  # ============================================================
  - name: Test Nginx
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e ssh \
        -o StrictHostKeyChecking=no \
        ${SERVER_USER}@${SERVER_HOST} \
        "nginx -t"


  # ============================================================
  # 13. Reload Nginx
  # ============================================================
  - name: Reload Nginx
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    run: |
      sshpass -e ssh \
        -o StrictHostKeyChecking=no \
        ${SERVER_USER}@${SERVER_HOST} \
        "systemctl reload nginx"


  # ============================================================
  # 14. Deployment completed
  # ============================================================
  - name: Deployment completed
    run: |
      echo "================================================"
      echo "Vidhik AI User Panel Deployment Successful"
      echo "================================================"
      echo "Application: VidhikAI_User_Panel"
      echo "PM2 Process: vidhik-user-panel"
      echo "Deployment Path: /var/www/html/VidhikAI_User_Panel"
      echo "================================================"
```
