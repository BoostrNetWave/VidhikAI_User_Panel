name: Deploy Vidhik AI User Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy User Panel
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT CODE
      # =====================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # =====================================================
      # 2. SETUP NODE
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # =====================================================
      # 3. CHECK NODE/NPM
      # =====================================================
      - name: Check Node and NPM versions
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

      # =====================================================
      # 4. INSTALL DEPENDENCIES
      #
      # Using npm install instead of npm ci because currently
      # package.json and package-lock.json are not in sync.
      # =====================================================
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install --no-audit --no-fund

      # =====================================================
      # 5. BUILD APPLICATION
      # =====================================================
      - name: Build application
        run: |
          echo "Building Vidhik AI User Panel..."
          npm run build

      # =====================================================
      # 6. VERIFY BUILD
      #
      # IMPORTANT:
      # This application creates:
      #
      # dist/client/index.html
      #
      # NOT:
      #
      # dist/index.html
      # =====================================================
      - name: Verify build
        run: |
          echo "========================================"
          echo "Checking Vite build output"
          echo "========================================"

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not found"
            exit 1
          fi

          if [ ! -d "dist/client" ]; then
            echo "ERROR: dist/client directory not found"
            exit 1
          fi

          if [ ! -f "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html not found"
            exit 1
          fi

          echo ""
          echo "Build verification successful."
          echo ""
          echo "Build contents:"
          ls -lah dist/client/

          echo ""
          echo "Assets:"
          ls -lah dist/client/assets/ || true

      # =====================================================
      # 7. INSTALL SSH TOOLS
      # =====================================================
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      # =====================================================
      # 8. TEST SSH CONNECTION
      # =====================================================
      - name: Test server connection
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Testing SSH connection to server..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "echo 'SSH connection successful' && hostname"

      # =====================================================
      # 9. PREPARE SERVER DIRECTORY
      # =====================================================
      - name: Prepare deployment directory
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "mkdir -p /var/www/html/VidhikAI_User_Panel/dist/client && \
             mkdir -p /var/www/backups"

      # =====================================================
      # 10. BACKUP CURRENT APPLICATION
      # =====================================================
      - name: Backup current application
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Creating backup of current application..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "if [ -d /var/www/html/VidhikAI_User_Panel/dist/client ]; then \
               rm -rf /var/www/backups/VidhikAI_User_Panel-client-previous && \
               cp -a /var/www/html/VidhikAI_User_Panel/dist/client \
               /var/www/backups/VidhikAI_User_Panel-client-previous && \
               echo 'Backup completed successfully'; \
             else \
               echo 'No existing deployment found. Skipping backup.'; \
             fi"

      # =====================================================
      # 11. DEPLOY BUILD
      #
      # Local:
      # dist/client/
      #
      # Server:
      # /var/www/html/VidhikAI_User_Panel/dist/client/
      # =====================================================
      - name: Deploy application to Vultr
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "========================================"
          echo "Deploying application to Vultr"
          echo "========================================"

          sshpass -e rsync \
            -avz \
            --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            dist/client/ \
            "${SERVER_USER}@${SERVER_HOST}:/var/www/html/VidhikAI_User_Panel/dist/client/"

          echo ""
          echo "File deployment completed."

      # =====================================================
      # 12. VERIFY DEPLOYMENT
      # =====================================================
      - name: Verify deployed files
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Verifying files on server..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "echo 'Deployment directory:' && \
             ls -lah /var/www/html/VidhikAI_User_Panel/dist/client/ && \
             echo '' && \
             echo 'Checking index.html...' && \
             test -f /var/www/html/VidhikAI_User_Panel/dist/client/index.html && \
             echo 'index.html found successfully'"

      # =====================================================
      # 13. VERIFY ASSETS
      # =====================================================
      - name: Verify deployed assets
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "if [ -d /var/www/html/VidhikAI_User_Panel/dist/client/assets ]; then \
               echo 'Assets directory found'; \
               ls -lah /var/www/html/VidhikAI_User_Panel/dist/client/assets | head -20; \
             else \
               echo 'ERROR: Assets directory not found'; \
               exit 1; \
             fi"

      # =====================================================
      # 14. TEST NGINX
      # =====================================================
      - name: Test Nginx configuration
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Testing Nginx configuration..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sudo nginx -t"

      # =====================================================
      # 15. RELOAD NGINX
      # =====================================================
      - name: Reload Nginx
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Reloading Nginx..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sudo systemctl reload nginx"

      # =====================================================
      # 16. CHECK NGINX STATUS
      # =====================================================
      - name: Check Nginx status
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sudo systemctl is-active nginx"

      # =====================================================
      # 17. LOCAL HTTP TEST FROM SERVER
      # =====================================================
      - name: Test application locally on server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Testing application through Nginx..."

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "curl -I -L --max-time 20 http://127.0.0.1/user/login || exit 1"

      # =====================================================
      # 18. DEPLOYMENT SUCCESS
      # =====================================================
      - name: Deployment completed
        run: |
          echo ""
          echo "================================================"
          echo "       Vidhik AI User Panel Deployment"
          echo "================================================"
          echo ""
          echo "STATUS      : SUCCESS"
          echo "APPLICATION : VidhikAI_User_Panel"
          echo "BUILD       : Vite"
          echo "NODE        : Node 24"
          echo "WEB SERVER  : Nginx"
          echo ""
          echo "Build path:"
          echo "dist/client/"
          echo ""
          echo "Server path:"
          echo "/var/www/html/VidhikAI_User_Panel/dist/client/"
          echo ""
          echo "Application:"
          echo "http://65.20.67.221/user/login"
          echo ""
          echo "================================================"
